<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Andre ↔ Bueter Private Chat</title>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: #eee;
  margin: 0;
  padding: 10px;
}

#chat {
  display: none;
}

#messages {
  height: 350px;
  overflow-y: auto;
  border: 1px solid #444;
  padding: 8px;
  margin-bottom: 10px;
  background: #1a1a1a;
}

input, button {
  padding: 10px;
  margin: 5px 0;
  width: 100%;
  box-sizing: border-box;
  background: #222;
  color: #eee;
  border: 1px solid #444;
}

button {
  cursor: pointer;
  background: #333;
}

button:hover {
  background: #444;
}

img {
  max-width: 240px;
  border-radius: 6px;
  margin-top: 6px;
}

.message {
  margin-bottom: 10px;
  padding: 5px;
}

.status {
  color: #888;
  font-size: 12px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div id="login">
  <h2>🔐 Private Chat Login</h2>
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Enter</button>
  <div class="status" id="status">Ready to login</div>
</div>

<div id="chat">
  <h3>💬 Andre ↔ Bueter</h3>
  <div id="messages"></div>

  <input id="msg" placeholder="Type a message..." onkeypress="if(event.key==='Enter') send()">
  <button onclick="send()">Send Message</button>

  <input id="file" type="file" accept="image/*">
  <button onclick="uploadImage()">📷 Upload Image (Max 100MB)</button>
  
  <div class="status" id="uploadStatus"></div>
</div>

<script>
// ============================================
// 🔥 FIREBASE CONFIGURATION
// ============================================
const firebaseConfig = {
  apiKey: "AIzaSyBA2RRY8NsHZ0qrpmFuboSIWjBhoeIWS3o",
  authDomain: "ab-chat-83b2c.firebaseapp.com",
  databaseURL: "https://ab-chat-83b2c-default-rtdb.firebaseio.com",
  projectId: "ab-chat-83b2c",
  storageBucket: "ab-chat-83b2c.firebasestorage.app",
  appId: "1:1055924916661:web:abcdef" // Optional but good practice
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);

// Get references
const db = firebase.database();
const storage = firebase.storage();

// Verify storage bucket
console.log("✅ Firebase initialized");
console.log("📦 Storage bucket:", firebase.app().options.storageBucket);

// Global state
let currentUser = "";

// ============================================
// 🔐 LOGIN FUNCTION
// ============================================
window.login = function() {
  const userInput = document.getElementById("user");
  const passInput = document.getElementById("pass");
  const statusDiv = document.getElementById("status");
  
  const u = userInput.value.trim();
  const p = passInput.value;

  // Hard-coded credentials
  if (
    (u === "Andre S" && p === "Astewartjr") ||
    (u === "Bueter" && p === "Zbueter")
  ) {
    currentUser = u;
    statusDiv.textContent = "✅ Login successful!";
    
    // Switch views
    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "block";
    
    // Start listening for messages
    listen();
  } else {
    statusDiv.textContent = "❌ Invalid username or password";
    statusDiv.style.color = "#f66";
  }
}

// ============================================
// 💬 SEND TEXT MESSAGE
// ============================================
window.send = function() {
  const msgInput = document.getElementById("msg");
  const text = msgInput.value.trim();
  
  if (!text) return;

  // Push to Firebase
  db.ref("chat").push({
    user: currentUser,
    text: text,
    time: Date.now()
  });

  msgInput.value = "";
}

// ============================================
// 🖼️ UPLOAD IMAGE
// ============================================
window.uploadImage = function() {
  const fileInput = document.getElementById("file");
  const uploadStatus = document.getElementById("uploadStatus");
  const file = fileInput.files[0];
  
  if (!file) {
    uploadStatus.textContent = "⚠️ Please select an image first";
    uploadStatus.style.color = "#fa0";
    return;
  }

  // Check file size (100MB = 100 * 1024 * 1024 bytes)
  const maxSize = 100 * 1024 * 1024;
  if (file.size > maxSize) {
    uploadStatus.textContent = "❌ Image too large (max 100MB)";
    uploadStatus.style.color = "#f66";
    return;
  }

  uploadStatus.textContent = "⏳ Uploading...";
  uploadStatus.style.color = "#4af";

  // Create storage reference
  const timestamp = Date.now();
  const storageRef = storage.ref("images/" + timestamp + "_" + file.name);

  // Upload file
  storageRef.put(file).then(snapshot => {
    console.log("✅ Upload complete");
    
    // Get download URL
    return snapshot.ref.getDownloadURL();
  }).then(url => {
    console.log("✅ Got URL:", url);
    
    // Save to database
    return db.ref("chat").push({
      user: currentUser,
      image: url,
      time: Date.now()
    });
  }).then(() => {
    uploadStatus.textContent = "✅ Image uploaded!";
    uploadStatus.style.color = "#4f4";
    fileInput.value = "";
    
    // Clear status after 3 seconds
    setTimeout(() => {
      uploadStatus.textContent = "";
    }, 3000);
  }).catch(error => {
    console.error("❌ Upload error:", error);
    uploadStatus.textContent = "❌ Upload failed: " + error.message;
    uploadStatus.style.color = "#f66";
  });
}

// ============================================
// 👂 LISTEN FOR NEW MESSAGES
// ============================================
function listen() {
  const messagesDiv = document.getElementById("messages");
  
  db.ref("chat").limitToLast(100).on("child_added", snap => {
    const m = snap.val();
    const messageDiv = document.createElement("div");
    messageDiv.className = "message";

    // Text message
    if (m.text) {
      messageDiv.innerHTML = `<b>${m.user}:</b> ${escapeHtml(m.text)}`;
    }

    // Image message
    if (m.image) {
      messageDiv.innerHTML = `
        <b>${m.user}:</b><br>
        <img src="${m.image}" alt="Shared image">
      `;
    }

    messagesDiv.appendChild(messageDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  });
}

// ============================================
// 🛡️ HELPER: ESCAPE HTML
// ============================================
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ============================================
// 🚀 INITIALIZATION
// ============================================
console.log("🚀 Chat app loaded successfully");
</script>

</body>
</html>
