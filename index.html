 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Andre ↔ Bueter Private Chat</title>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script> <!-- ADDED: Firebase Auth SDK -->

<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: #eee;
  margin: 0;
  padding: 10px;
}

#chat {
  display: none;
}

#messages {
  height: 350px;
  overflow-y: auto;
  border: 1px solid #444;
  padding: 8px;
  margin-bottom: 10px;
  background: #1a1a1a;
}

input, button {
  padding: 10px;
  margin: 5px 0;
  width: 100%;
  box-sizing: border-box;
  background: #222;
  color: #eee;
  border: 1px solid #444;
}

button {
  cursor: pointer;
  background: #333;
}

button:hover {
  background: #444;
}

img {
  max-width: 240px;
  border-radius: 6px;
  margin-top: 6px;
}

.message {
  margin-bottom: 10px;
  padding: 5px;
}

.status {
  color: #888;
  font-size: 12px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div id="login">
  <h2> Schoology Login page </h2>
  <!-- Changed 'id="user"' to 'id="email"' for Firebase Auth compatibility -->
  <input id="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <!-- Added an optional Sign Up button for new users -->
  <button onclick="signup()">Sign Up (first time users)</button> 
  <div class="status" id="status">Ready to login</div>
</div>

<div id="chat">
  <h3>💬 Andre ↔ Bueter</h3>
  <div id="messages"></div>

  <input id="msg" placeholder="Type a message..." onkeypress="if(event.key==='Enter') send()">
  <button onclick="send()">Send Message</button>

  <input id="file" type="file" accept="image/*">
  <button onclick="uploadImage()">📷 Upload Image (Max 100MB)</button>
  
  <div class="status" id="uploadStatus"></div>
  <button onclick="logout()">Logout</button> <!-- ADDED: Logout Button -->
</div>

<script>
// ============================================
// 🔥 FIREBASE CONFIGURATION (copied from your data)
// ============================================
const firebaseConfig = {
  apiKey: "AIzaSyBA2RRY8NsHZ0qrpmFuboSIWjBhoeIWS3o",
  authDomain: "ab-chat-83b2c.firebaseapp.com",
  databaseURL: "https://ab-chat-83b2c-default-rtdb.firebaseio.com",
  projectId: "ab-chat-83b2c",
  storageBucket: "ab-chat-83b2c.firebasestorage.app",
  appId: "1:1055924916661:web:abcdef" // Your original App ID
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);

// Get references to Firebase services
const db = firebase.database();
const storage = firebase.storage();
const auth = firebase.auth(); // NEW: Reference to Firebase Authentication service

// Verify storage bucket
console.log("✅ Firebase initialized");
console.log("📦 Storage bucket:", firebase.app().options.storageBucket);

// Global state for authenticated user's display name/email
let currentUserName = ""; // Will be set by Firebase Auth

// Flag to ensure the message listener isn't added multiple times
let messagesListenerActive = false;

// ============================================
// 🔐 AUTHENTICATION FUNCTIONS (Firebase Auth)
// ============================================

// Login function using Firebase Email/Password Authentication
window.login = function() {
  const emailInput = document.getElementById("email"); // Input for email
  const passInput = document.getElementById("pass");
  const statusDiv = document.getElementById("status");
  
  const email = emailInput.value.trim();
  const password = passInput.value;

  statusDiv.textContent = "Logging in...";
  auth.signInWithEmailAndPassword(email, password)
    .then((userCredential) => {
      // Login successful. The onAuthStateChanged listener will handle UI.
      statusDiv.textContent = "✅ Login successful!";
      statusDiv.style.color = "#4f4";
      emailInput.value = ''; // Clear input fields
      passInput.value = '';
    })
    .catch((error) => {
      // Handle login errors
      statusDiv.textContent = `❌ Login failed: ${error.message}`;
      statusDiv.style.color = "#f66";
      console.error("Login error:", error);
    });
}

// Optional: Sign Up function for new users
window.signup = function() {
  const emailInput = document.getElementById("email");
  const passInput = document.getElementById("pass");
  const statusDiv = document.getElementById("status");

  const email = emailInput.value.trim();
  const password = passInput.value;

  statusDiv.textContent = "Signing up...";
  auth.createUserWithEmailAndPassword(email, password)
    .then((userCredential) => {
      // Sign up successful. User is automatically logged in.
      statusDiv.textContent = "✅ Sign up successful! Logged in automatically.";
      statusDiv.style.color = "#4f4";
      emailInput.value = ''; // Clear input fields
      passInput.value = '';
      // Optional: Update user profile with a display name if you want
      // userCredential.user.updateProfile({ displayName: "New User Name" });
    })
    .catch((error) => {
      statusDiv.textContent = `❌ Sign up failed: ${error.message}`;
      statusDiv.style.color = "#f66";
      console.error("Sign up error:", error);
    });
}

// Logout function
window.logout = function() {
  auth.signOut()
    .then(() => {
      // Sign-out successful. onAuthStateChanged listener will handle UI.
      console.log("User signed out.");
    })
    .catch((error) => {
      // An error happened.
      console.error("Logout error:", error);
    });
}

// ============================================
// LISTEN FOR AUTH STATE CHANGES (Crucial for UI management)
// ============================================
auth.onAuthStateChanged((user) => {
  if (user) {
    // User is signed in.
    // Prioritize displayName if available, otherwise use email as display name.
    currentUserName = user.displayName || user.email; 
    console.log("User is signed in:", currentUserName, "UID:", user.uid);

    // Show chat interface, hide login
    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "block";
    document.getElementById("status").textContent = ""; // Clear login status

    // Start listening for messages only once when user logs in
    if (!messagesListenerActive) {
      listen();
      messagesListenerActive = true; 
    }
    
  } else {
    // User is signed out.
    currentUserName = ""; // Clear current user name
    console.log("No user is signed in.");

    // Show login interface, hide chat
    document.getElementById("login").style.display = "block";
    document.getElementById("chat").style.display = "none";
    document.getElementById("status").textContent = "Ready to login"; // Reset login status

    // If a listener was active, optionally clear messages and prepare for next login
    if (messagesListenerActive) {
        // To properly stop listening, you'd need to store the `on` callback reference
        // For simplicity here, we clear the displayed messages. Firebase rules will
        // block further access even if the listener technically remains 'active'
        // on the client side without receiving data.
        document.getElementById("messages").innerHTML = ""; 
        messagesListenerActive = false; // Reset flag
    }
  }
});

// ============================================
// 💬 SEND TEXT MESSAGE (Updated to use Firebase Auth user)
// ============================================
window.send = function() {
  const msgInput = document.getElementById("msg");
  const text = msgInput.value.trim();
  
  if (!text) return;

  // Ensure an authenticated user is present
  if (!auth.currentUser) { 
      document.getElementById("status").textContent = "❌ You must be logged in to send messages!";
      document.getElementById("status").style.color = "#f66";
      return;
  }

  // Push to Firebase Realtime Database
  db.ref("chat").push({
    user: currentUserName, // Use the display name from Firebase Auth
    text: text,
    time: Date.now()
  });

  msgInput.value = "";
}

// ============================================
// 🖼️ UPLOAD IMAGE (Updated to use Firebase Auth user)
// ============================================
window.uploadImage = function() {
  const fileInput = document.getElementById("file");
  const uploadStatus = document.getElementById("uploadStatus");
  const file = fileInput.files[0];
  
  if (!file) {
    uploadStatus.textContent = "⚠️ Please select an image first";
    uploadStatus.style.color = "#fa0";
    return;
  }

  // Ensure an authenticated user is present
  if (!auth.currentUser) { 
      uploadStatus.textContent = "❌ You must be logged in to upload images!";
      uploadStatus.style.color = "#f66";
      return;
  }

  // Check file size (100MB = 100 * 1024 * 1024 bytes)
  const maxSize = 100 * 1024 * 1024;
  if (file.size > maxSize) {
    uploadStatus.textContent = "❌ Image too large (max 100MB)";
    uploadStatus.style.color = "#f66";
    return;
  }

  uploadStatus.textContent = "⏳ Uploading...";
  uploadStatus.style.color = "#4af";

  // Create storage reference, using the authenticated user's UID for organization
  const timestamp = Date.now();
  const storageRef = storage.ref(`images/${auth.currentUser.uid}/${timestamp}_${file.name}`); 

  // Upload file to Cloud Storage
  storageRef.put(file).then(snapshot => {
    console.log("✅ Upload complete");
    // Get the public download URL
    return snapshot.ref.getDownloadURL();
  }).then(url => {
    console.log("✅ Got URL:", url);
    // Save image URL to Firebase Realtime Database
    return db.ref("chat").push({
      user: currentUserName, // Use the display name from Firebase Auth
      image: url,
      time: Date.now()
    });
  }).then(() => {
    uploadStatus.textContent = "✅ Image uploaded!";
    uploadStatus.style.color = "#4f4";
    fileInput.value = ""; // Clear file input
    
    // Clear status message after a few seconds
    setTimeout(() => {
      uploadStatus.textContent = "";
    }, 3000);
  }).catch(error => {
    console.error("❌ Upload error:", error);
    uploadStatus.textContent = "❌ Upload failed: " + error.message;
    uploadStatus.style.color = "#f66";
  });
}

// ============================================
// 👂 LISTEN FOR NEW MESSAGES
// ============================================
function listen() {
  const messagesDiv = document.getElementById("messages");
  // Clear existing messages before adding a new listener
  messagesDiv.innerHTML = ""; 
  
  db.ref("chat").limitToLast(100).on("child_added", snap => {
    const m = snap.val();
    const messageDiv = document.createElement("div");
    messageDiv.className = "message";

    // Text message
    if (m.text) {
      messageDiv.innerHTML = `<b>${m.user}:</b> ${escapeHtml(m.text)}`;
    }

    // Image message
    if (m.image) {
      messageDiv.innerHTML = `
        <b>${m.user}:</b><br>
        <img src="${m.image}" alt="Shared image">
      `;
    }

    messagesDiv.appendChild(messageDiv);
    // Scroll to the bottom to show the newest message
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  });
}

// ============================================
// 🛡️ HELPER: ESCAPE HTML
// ============================================
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ============================================
// 🚀 INITIALIZATION
// ============================================
console.log("🚀 Chat app loaded successfully");
// The onAuthStateChanged listener handles the initial UI setup upon load.
</script>

</body>
</html>
