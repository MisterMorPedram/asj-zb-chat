<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Private Chat</title>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: #eee;
  margin: 0;
  padding: 10px;
}

#chat {
  display: none;
}

#messages {
  height: 350px;
  overflow-y: auto;
  border: 1px solid #444;
  padding: 8px;
  margin-bottom: 10px;
}

input, button {
  padding: 10px;
  margin: 5px 0;
  width: 100%;
  box-sizing: border-box;
  background: #222;
  color: #eee;
  border: 1px solid #444;
}

button {
  cursor: pointer;
}

img {
  max-width: 240px;
  border-radius: 6px;
  margin-top: 6px;
}
</style>
</head>

<body>

<div id="login">
  <h2>Private Chat Login</h2>
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Enter</button>
</div>

<div id="chat">
  <h3>Andre ↔ Bueter</h3>
  <div id="messages"></div>

  <input id="msg" placeholder="Type a message...">
  <button onclick="send()">Send Message</button>

  <input id="file" type="file" accept="image/*">
  <button onclick="uploadImage()">Upload Image</button>
</div>

<script>
/* 🔥 Firebase Config — Correct Bucket */
const firebaseConfig = {
  apiKey: "AIzaSyBA2RRY8NsHZ0qrpmFuboSIWjBhoeIWS3o",
  authDomain: "ab-chat-83b2c.firebaseapp.com",
  databaseURL: "https://ab-chat-83b2c-default-rtdb.firebaseio.com",
  projectId: "ab-chat-83b2c",
  storageBucket: "ab-chat-83b2c.firebasestorage.app"
};

firebase.initializeApp(firebaseConfig);

console.log("Bucket in use:", firebase.app().options.storageBucket);

const db = firebase.database();
const storage = firebase.storage();

let currentUser = "";

/* 🔐 Login */
window.login = function() {
  const u = user.value;
  const p = pass.value;

  if (
    (u === "Andre S" && p === "Astewartjr") ||
    (u === "Bueter" && p === "Zbueter")
  ) {
    currentUser = u;
    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "block";
    listen();
  } else {
    alert("Invalid login");
  }
}

/* 💬 Send text */
window.send = function() {
  if (!msg.value.trim()) return;

  db.ref("chat").push({
    user: currentUser,
    text: msg.value,
    time: Date.now()
  });

  msg.value = "";
}

/* 🖼️ Upload image */
window.uploadImage = function() {
  const fileInput = document.getElementById("file");
  const file = fileInput.files[0];
  if (!file) return alert("Select an image first");

  if (file.size > 100 * 1024 * 1024) {
    alert("Max image size is 100MB");
    return;
  }

  const ref = storage.ref("images/" + Date.now() + "_" + file.name);

  ref.put(file).then(snapshot => {
    snapshot.ref.getDownloadURL().then(url => {
      db.ref("chat").push({
        user: currentUser,
        image: url,
        time: Date.now()
      });
    });
  });

  fileInput.value = "";
}

/* 👂 Listen */
function listen() {
  db.ref("chat").limitToLast(100).on("child_added", snap => {
    const m = snap.val();

    if (m.text) {
      messages.innerHTML += `<div><b>${m.user}:</b> ${m.text}</div>`;
    }

    if (m.image) {
      messages.innerHTML += `
        <div>
          <b>${m.user}:</b><br>
          <img src="${m.image}">
        </div>
      `;
    }

    messages.scrollTop = messages.scrollHeight;
  });
}
</script>

</body>
</html>
