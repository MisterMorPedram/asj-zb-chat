<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Andre ↔ Bueter Private Chat</title>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
body { font-family: Arial, sans-serif; background: #111; color: #eee; margin: 0; padding: 10px; }
#chat { display: none; }
#messages { height: 350px; overflow-y: auto; border: 1px solid #444; padding: 8px; margin-bottom: 10px; background: #1a1a1a; }
input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; background: #222; color: #eee; border: 1px solid #444; }
button { cursor: pointer; background: #333; }
button:hover { background: #444; }
img { max-width: 240px; border-radius: 6px; margin-top: 6px; }
.message { margin-bottom: 10px; padding: 5px; border-bottom: 1px solid #222; }
.status-bar { display: flex; gap: 15px; background: #222; padding: 10px; margin-bottom: 10px; border-radius: 5px; font-size: 13px; }
.dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
.online { background: #4f4; }
.offline { background: #f44; }
.muted { background: #ff0; }
.offline-muted { background: #000; border: 1px solid #444; }
.nav-controls { margin-bottom: 10px; font-size: 14px; background: #222; padding: 10px; border-radius: 5px; }
</style>
</head>

<body>

<div id="login">
  <h2> Schoology Login page </h2>
  <input id="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <button onclick="signup()">Sign Up (first time users)</button> 
  <div id="status" style="color: #888; font-size: 12px; margin-top: 10px;">Ready to login</div>
</div>

<div id="chat">
  <div class="status-bar">
    <span><b>Status:</b></span>
    <span id="stat-Andre"><span class="dot offline"></span> Andre</span>
    <span id="stat-Bueter"><span class="dot offline"></span> Bueter</span>
  </div>

  <div class="nav-controls">
    <label><input type="checkbox" id="notifyToggle" checked onchange="updateMyStatus()"> Enable Notifications (Pings)</label>
  </div>

  <div id="messages"></div>

  <input id="msg" placeholder="Type a message..." onkeypress="if(event.key==='Enter') send()">
  <button onclick="send()">Send Message</button>
  <input id="file" type="file" accept="image/*">
  <button onclick="uploadImage()">📷 Upload Image</button>
  <button onclick="logout()" style="color: #f66;">Logout</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBA2RRY8NsHZ0qrpmFuboSIWjBhoeIWS3o",
  authDomain: "ab-chat-83b2c.firebaseapp.com",
  databaseURL: "https://ab-chat-83b2c-default-rtdb.firebaseio.com",
  projectId: "ab-chat-83b2c",
  storageBucket: "ab-chat-83b2c.firebasestorage.app",
  appId: "1:1055924916661:web:abcdef"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();
const auth = firebase.auth();

let currentUserName = "";
let isInitialLoad = true;

// --- LOGIN / LOGOUT ---
window.login = function() {
  auth.signInWithEmailAndPassword(document.getElementById("email").value, document.getElementById("pass").value)
    .catch(e => alert(e.message));
}

window.signup = function() {
  auth.createUserWithEmailAndPassword(document.getElementById("email").value, document.getElementById("pass").value)
    .catch(e => alert(e.message));
}

window.logout = function() {
  if(currentUserName) db.ref('status/' + currentUserName).set('offline');
  auth.signOut();
}

auth.onAuthStateChanged(user => {
  if (user) {
    currentUserName = user.email.split('@')[0].toLowerCase().includes('andre') ? "Andre" : "Bueter";
    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "block";
    setupStatusTracking();
    listen();
  } else {
    document.getElementById("login").style.display = "block";
    document.getElementById("chat").style.display = "none";
  }
});

// --- STATUS TRACKING ---
function setupStatusTracking() {
  const myStatusRef = db.ref('status/' + currentUserName);
  const connectedRef = db.ref('.info/connected');

  connectedRef.on('value', (snap) => {
    if (snap.val() === false) return;
    myStatusRef.onDisconnect().set(document.getElementById("notifyToggle").checked ? 'offline' : 'offline-muted');
    updateMyStatus();
  });

  // Watch Andre and Bueter's status
  ['Andre', 'Bueter'].forEach(name => {
    db.ref('status/' + name).on('value', (snap) => {
      const val = snap.val() || 'offline';
      const el = document.getElementById('stat-' + name);
      let colorClass = 'offline';
      if(val === 'online') colorClass = 'online';
      if(val === 'muted') colorClass = 'muted';
      if(val === 'offline-muted') colorClass = 'offline-muted';
      el.innerHTML = `<span class="dot ${colorClass}"></span> ${name}`;
    });
  });
}

function updateMyStatus() {
  if(!currentUserName) return;
  const isMuted = !document.getElementById("notifyToggle").checked;
  db.ref('status/' + currentUserName).set(isMuted ? 'muted' : 'online');
}

// --- MESSAGING ---
window.send = function() {
  const text = document.getElementById("msg").value.trim();
  if (!text || !auth.currentUser) return;
  db.ref("chat").push({ user: currentUserName, text: text, time: Date.now() });
  document.getElementById("msg").value = "";
}

function listen() {
  db.ref("chat").limitToLast(1).on("child_added", snap => {
    const m = snap.val();
    const messagesDiv = document.getElementById("messages");
    
    // Add message to UI
    const div = document.createElement("div");
    div.className = "message";
    div.innerHTML = m.text ? `<b>${m.user}:</b> ${escapeHtml(m.text)}` : `<b>${m.user}:</b><br><img src="${m.image}">`;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    // Notification Logic
    if (!isInitialLoad && m.user !== currentUserName) {
      if (document.getElementById("notifyToggle").checked) {
        console.log("Schoology: Notification");
        playPing();
      }
    }
  });
  // Prevent pings for the 100 old messages on load
  setTimeout(() => { isInitialLoad = false; }, 2000);
}

// Simple Web Audio Ping (No file needed)
function playPing() {
  const context = new (window.AudioContext || window.webkitAudioContext)();
  const osc = context.createOscillator();
  const gain = context.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(880, context.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.00001, context.currentTime + 0.5);
  osc.connect(gain);
  gain.connect(context.destination);
  osc.start();
  osc.stop(context.currentTime + 0.5);
}

window.uploadImage = function() {
  const file = document.getElementById("file").files[0];
  if (!file) return;
  const ref = storage.ref(`images/${Date.now()}_${file.name}`);
  ref.put(file).then(snap => snap.ref.getDownloadURL()).then(url => {
    db.ref("chat").push({ user: currentUserName, image: url, time: Date.now() });
  });
}

function escapeHtml(t) {
  const d = document.createElement('div'); d.textContent = t; return d.innerHTML;
}
</script>
</body>
</html>
